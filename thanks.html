<style>
:root {
  --primary: #5577FE;
  --primary-hover: #3F61E8;
  --kakao: #FEE500;
  --text-dark: #1A1A1A;
  --text-body: #4B5563;
  --text-muted: #6B7280;
  --bg-page: #EEF2FA;
  --bg-callout: #F0F4FA;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-page);
  color: var(--text-dark);
  line-height: 1.6;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.thanks-container {
  max-width: 540px;
  margin: 0 auto;
  padding: 60px 24px 32px;
}

.thanks-card {
  background: #FFFFFF;
  border-radius: 24px;
  padding: 56px 48px 48px;
  box-shadow: 0 4px 32px rgba(0, 0, 0, 0.04);
  animation: fadeUp 0.6s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.thanks-headline {
  font-size: 44px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -1.6px;
  margin-bottom: 32px;
}

.section-title {
  font-size: 16.5px;
  font-weight: 800;
  color: var(--text-dark);
  margin-bottom: 12px;
  letter-spacing: -0.3px;
}

.thanks-section {
  margin-bottom: 24px;
  font-size: 14.5px;
  line-height: 1.85;
  color: var(--text-body);
}

.thanks-section p { margin: 0; }
.thanks-section p + p { margin-top: 4px; }

/* 입력한 이메일 표시 박스 */
.email-callout {
  background: var(--bg-callout);
  border-left: 3px solid var(--primary);
  border-radius: 8px;
  padding: 16px 18px;
  margin: 16px 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.email-icon {
  font-size: 22px;
  flex-shrink: 0;
}

.email-text {
  font-size: 14px;
  line-height: 1.65;
  color: var(--text-dark);
}

.email-address {
  color: var(--primary);
  font-weight: 700;
  word-break: break-all;
}

/* 작곡가 소개 시기 안내 */
.gift-list { margin-top: 6px; }

.gift-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  color: var(--text-body);
}

/* 버튼 */
.btn-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 36px;
}

.btn {
  width: 100%;
  padding: 18px 24px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  text-decoration: none;
}

.btn-primary {
  background: var(--primary);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(85, 119, 254, 0.25);
}

.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(85, 119, 254, 0.35);
}

.btn-icon { font-size: 18px; line-height: 1; }

/* TALK 아이콘 */
.kakao-icon-row {
  display: flex;
  justify-content: center;
  margin-top: 36px;
}

.kakao-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--kakao);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 11px;
  color: #3C1E1E;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 8px rgba(254, 229, 0, 0.3);
}

@media (max-width: 540px) {
  .thanks-container { padding: 32px 16px 24px; }
  .thanks-card { padding: 40px 28px 36px; border-radius: 20px; }
  .thanks-headline { font-size: 34px; letter-spacing: -1.2px; margin-bottom: 24px; }
  .btn { padding: 16px 20px; font-size: 15px; }
}
</style>
</head>
<body>

<div class="thanks-container">
  <div class="thanks-card">
    
    <h1 class="thanks-headline">감사합니다!</h1>
    
    <!-- 핵심 안내: 메일 확인 필수 -->
    <div class="thanks-section">
      <p class="section-title">메일 확인을 하셔야 최종 완료됩니다!</p>
    </div>
    
    <!-- 입력한 이메일 표시 -->
    <div class="email-callout">
      <div class="email-icon">📧</div>
      <div class="email-text">
        <span class="email-address" id="user_email">입력하신 이메일</span> 으로<br>
        확인 이메일이 발송되었습니다!
      </div>
    </div>
    
    <div class="thanks-section">
      <p>이메일주소 스팸 방지를 위해 확인 메일이 발송됩니다.</p>
      <p>확인 메일이 도착하지 않으신 경우엔 스팸함을 확인해주세요!</p>
    </div>
    
    <!-- 카카오톡 안내 -->
    <div class="thanks-section">
      <p>문의가 있으시거나, 제품/행사 소식을<br>받아보실 분께선 아래 카카오톡 버튼을 통해 카카오톡 친구를 등록해주세요 🎻</p>
      <p>(@아로필 혹은 아래 버튼으로 등록하기)</p>
    </div>
    
    <!-- 작곡가 시리즈 발송 시기 -->
    <div class="thanks-section">
      <p class="section-title">작곡가 소개는 2~3월중 발송이 시작됩니다</p>
      <div class="gift-list">
        <div class="gift-line">🎁 바로크~현대 시대의 작곡가</div>
      </div>
    </div>
    
    <!-- 버튼 -->
    <div class="btn-group">
      <a href="https://arophil.kr" class="btn btn-primary">
        <span>웹사이트로 돌아가기</span>
        <span class="btn-icon">🏠</span>
      </a>
      <a href="https://pf.kakao.com/_xcxfBtG" class="btn btn-primary" target="_blank" rel="noopener">
        <span>카카오톡 친구 등록하기</span>
        <span class="btn-icon">💬</span>
      </a>
    </div>
    
    <!-- TALK 아이콘 -->
    <div class="kakao-icon-row">
      <div class="kakao-icon">TALK</div>
    </div>
    
  </div>
</div>

<script>
// sessionStorage에서 입력한 이메일 불러와 표시
window.addEventListener('DOMContentLoaded', function() {
  try {
    var savedEmail = sessionStorage.getItem('arophil_email');
    if (savedEmail) {
      document.getElementById('user_email').textContent = savedEmail;
    }
  } catch (e) {
    // sessionStorage 차단된 환경 - 기본 텍스트 유지
  }
});
</script>

</body>
</html>
